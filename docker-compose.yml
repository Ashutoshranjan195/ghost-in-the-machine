version: '3.8'

services:
  echoes-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: echoes-memory-keeper
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:3b
      - OFFLINE_MODE_ENFORCED=true
    volumes:
      - ./data:/app/data
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: echoes-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  ollama_models:
